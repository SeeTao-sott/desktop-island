<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>裂缝射击</title>
    <link rel="stylesheet" href="/src/rift/rift.css" />
  </head>
  <body>
    <!-- 看不出来的一层底：透明像素的点击会穿到桌面上，游戏时整个窗口要接住鼠标、保住键盘焦点 -->
    <div id="catch"></div>
    <canvas id="view"></canvas>
    <!-- 准星：固定在屏幕正中 -->
    <div id="cross" class="cross" hidden></div>
    <!-- 枪口闪光 -->
    <div id="flash" class="flash"></div>
    <!-- 裂缝里的菜单：开始 / 设置 / 退出；暂停时换成 继续 / 重开 / 退出 -->
    <div id="menu" class="menu" hidden>
      <div class="menu-title"></div>
      <div class="menu-buttons"></div>
      <div class="menu-tip"></div>
    </div>
    <!-- 开始时裂缝合上一下，中间闪出 GAME START -->
    <div id="banner" class="banner" hidden>GAME START</div>
    <!-- 设置：调灵敏度、准星、模式…… -->
    <div id="start" class="start" hidden>
      <div class="start-head">
        <div class="start-title">设置</div>
        <button class="start-back">返回</button>
      </div>
      <div id="settings" class="settings"></div>
    </div>
    <div id="info" class="info" hidden></div>
    <div id="test" class="test" hidden>
      <span>测试：靶墙行数 N</span>
      <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
      <span class="hint">Esc 退出</span>
    </div>
    <script type="module" src="/src/rift/rift.ts"></script>
  </body>
</html>
