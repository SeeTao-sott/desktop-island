<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手柄按键显示</title>
    <link rel="stylesheet" href="/src/pad/pad.css" />
  </head>
  <body>
    <svg id="pad" viewBox="0 0 300 190" aria-hidden="true">
      <!-- 扳机：按多深填多少 -->
      <g class="trigger" id="lt"><rect class="track" x="56" y="4" width="56" height="9" rx="4.5" /><rect class="fill" x="56" y="4" width="56" height="9" rx="4.5" /><text x="84" y="11.5">LT</text></g>
      <g class="trigger" id="rt"><rect class="track" x="188" y="4" width="56" height="9" rx="4.5" /><rect class="fill" x="188" y="4" width="56" height="9" rx="4.5" /><text x="216" y="11.5">RT</text></g>
      <!-- 肩键 -->
      <rect class="btn" data-bit="256" x="50" y="18" width="68" height="15" rx="7.5" /><text class="lbl" x="84" y="29">LB</text>
      <rect class="btn" data-bit="512" x="182" y="18" width="68" height="15" rx="7.5" /><text class="lbl" x="216" y="29">RB</text>
      <!-- 机身 -->
      <path class="body" d="M78,38 C48,38 30,52 22,92 C12,140 16,184 44,184 C64,184 74,166 92,146 L208,146 C226,166 236,184 256,184 C284,184 288,140 278,92 C270,52 252,38 222,38 Z" />
      <!-- 左摇杆 -->
      <g class="stick" id="ls"><circle class="well" cx="86" cy="82" r="22" /><circle class="cap" cx="86" cy="82" r="13" /></g>
      <!-- 十字键 -->
      <g class="dpad">
        <rect class="btn" data-bit="1" x="111" y="106" width="13" height="15" rx="2.5" />
        <rect class="btn" data-bit="2" x="111" y="134" width="13" height="15" rx="2.5" />
        <rect class="btn" data-bit="4" x="96" y="121" width="15" height="13" rx="2.5" />
        <rect class="btn" data-bit="8" x="124" y="121" width="15" height="13" rx="2.5" />
        <rect class="hub" x="111" y="121" width="13" height="13" />
      </g>
      <!-- 右摇杆 -->
      <g class="stick" id="rs"><circle class="well" cx="184" cy="126" r="22" /><circle class="cap" cx="184" cy="126" r="13" /></g>
      <!-- Back / Start -->
      <rect class="btn small" data-bit="32" x="124" y="76" width="16" height="10" rx="5" />
      <rect class="btn small" data-bit="16" x="160" y="76" width="16" height="10" rx="5" />
      <!-- 电量 -->
      <g id="battery" style="display: none">
        <rect class="bat-shell" x="138" y="52" width="22" height="10" rx="2" /><rect class="bat-tip" x="160" y="55" width="2" height="4" />
        <rect class="bat-bar" x="140" y="54" width="5" height="6" /><rect class="bat-bar" x="146.5" y="54" width="5" height="6" /><rect class="bat-bar" x="153" y="54" width="5" height="6" />
      </g>
      <!-- A B X Y -->
      <g class="face">
        <circle class="btn y" data-bit="32768" cx="218" cy="62" r="10" /><text x="218" y="66">Y</text>
        <circle class="btn x" data-bit="16384" cx="198" cy="82" r="10" /><text x="198" y="86">X</text>
        <circle class="btn b" data-bit="8192" cx="238" cy="82" r="10" /><text x="238" y="86">B</text>
        <circle class="btn a" data-bit="4096" cx="218" cy="102" r="10" /><text x="218" y="106">A</text>
      </g>
    </svg>
    <script type="module" src="/src/pad/pad.ts"></script>
  </body>
</html>
