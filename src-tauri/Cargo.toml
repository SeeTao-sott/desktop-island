[package]
name = "desktop-island"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
png = "0.18"
# #[implement] 宏展开后会直接引用 windows_core
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_WinRT",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "System_Power",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_RestartManager",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell_Common",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
