[package]
name = "desktop-island"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
