<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>裂缝射击可行性测试</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
      /* 中间横带：只有这里画东西，外面完全透明 */
      #band { position: fixed; left: 0; right: 0; }
      #band canvas { display: block; }
      #hud { position: fixed; left: 24px; color: #fff; font-size: 14px; line-height: 1.6; text-shadow: 0 1px 3px #000; white-space: pre; pointer-events: none; }
      #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
      #cross::before, #cross::after { content: ""; position: absolute; background: #0f0; }
      #cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
      #cross::after { top: 6px; left: 0; height: 2px; width: 14px; }
      /* 1% 底：透明像素点击会穿过去，横带外面要接住"点一下锁定鼠标" */
      #catch { position: fixed; inset: 0; background: rgba(0,0,0,0.012); }
    </style>
  </head>
  <body>
    <div id="catch"></div>
    <div id="band"></div>
    <div id="cross"></div>
    <div id="hud"></div>
    <script type="module" src="/src/rift/test.ts"></script>
  </body>
</html>
